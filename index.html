<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle de Vacinas</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
    background: linear-gradient(90deg,#020817,#04122b,#020817);
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

.topo{
    width:100%;
    padding:30px 40px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo-central{
    width:100%;
    text-align:center;
}

.logo-central img{
    width:180px;
    margin-bottom:15px;
}

.logo-central h1{
    font-size:48px;
    font-weight:800;
    letter-spacing:1px;
}

/* ================= BOTÃO ================= */

.btn-print{
    position:fixed;
    top:20px;
    right:20px;
    background:#fff;
    color:#000;
    border:none;
    padding:15px 28px;
    border-radius:14px;
    font-weight:700;
    cursor:pointer;
    z-index:999;
    transition:0.3s;
}

.btn-print:hover{
    transform:scale(1.03);
}

/* ================= CARD ================= */

.container{
    width:95%;
    max-width:1700px;
    margin:auto;
    flex:1;
}

.card{
    background:#1f1f1f;
    border-radius:22px;
    padding:30px;
    margin-top:20px;
    box-shadow:0 0 30px rgba(0,0,0,0.3);
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
}

input,select{
    width:100%;
    height:58px;
    border-radius:14px;
    border:1px solid #444;
    background:#2a2a2a;
    color:#fff;
    padding:0 15px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#5d5dff;
}

.btn-add{
    margin-top:20px;
    width:100%;
    height:60px;
    border:none;
    border-radius:16px;
    background:linear-gradient(90deg,#0a00ff,#6a00ff);
    color:#fff;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.btn-add:hover{
    transform:scale(1.01);
}

/* ================= TABELA ================= */

.table-container{
    margin-top:30px;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:15px;
}

thead{
    background:#315efb;
}

thead th{
    padding:14px;
    font-size:15px;
    text-align:center;
}

tbody tr{
    background:#242424;
}

tbody tr:nth-child(even){
    background:#2d2d2d;
}

tbody td{
    padding:14px;
    text-align:center;
}

.btn-delete{
    background:red;
    border:none;
    color:#fff;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}

/* ================= FOOTER ================= */

.footer{
    width:100%;
    margin-top:40px;
    padding:20px;
    text-align:center;
    background:#010b1d;
    border-top:1px solid rgba(255,255,255,0.1);
    font-size:14px;
    color:#cfcfcf;
}

.footer strong{
    color:#fff;
}

/* ================= IMPRESSÃO ================= */

.print-area{
    display:none;
}

@media print{

    @page{
        size:A4 landscape;
        margin:5mm;
    }

    body{
        background:#fff;
        color:#000;
    }

    .topo,
    .card,
    .btn-print,
    .table-container,
    .footer{
        display:none !important;
    }

    .print-area{
        display:block;
        width:100%;
        margin:0;
        padding:0;
    }

    .print-box{
        width:100%;
        border:2px solid #000;
        border-radius:10px;
        padding:10px;
        margin:0;
    }

    .print-header{
        text-align:center;
        margin-bottom:10px;
    }

    .print-header img{
        width:120px;
        margin-bottom:5px;
    }

    .print-header h2{
        font-size:20px;
        color:#000;
        margin-bottom:3px;
    }

    .print-header p{
        color:#000;
        font-size:13px;
    }

    .print-table{
        width:100%;
        border-collapse:collapse;
        margin-top:5px;
    }

    .print-table th{
        background:#ddd !important;
        color:#000 !important;
        border:1px solid #000;
        padding:6px;
        font-size:11px;
    }

    .print-table td{
        border:1px solid #000;
        padding:6px;
        font-size:11px;
        color:#000;
        text-align:center;
    }

    .print-footer{
        margin-top:10px;
        text-align:center;
        font-size:11px;
        color:#000;
    }

}

@media(max-width:900px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .logo-central h1{
        font-size:32px;
    }

}

</style>
</head>
<body>

<button class="btn-print" onclick="window.print()">
IMPRIMIR
</button>

<div class="topo">

    <div class="logo-central">

        <img src="https://www.natal.rn.gov.br/sme/matriculaonline/img/logo_natal_ws.png" alt="Logo Prefeitura">

        <h1>CONTROLE DE VACINAS</h1>

    </div>

</div>

<div class="container">

    <div class="card">

        <div class="form-grid">

            <!-- VACINAS -->
            <select id="vacina">

                <option selected>ANTIRRÁBICA</option>
                <option>DT ADULTO</option>
                <option>DTpa GESTANTE</option>
                <option>DTp INFANTIL</option>
                <option>FEBRE AMARELA</option>
                <option>HPV4</option>
                <option>HEPATITE B</option>
                <option>HEPATITE PED A</option>
                <option>VARICELA</option>
                <option>MENINGO ACWY</option>
                <option>MENINGO C</option>
                <option>QDENGA</option>
                <option>DENGUE</option>
                <option>PENTA</option>
                <option>PNEUMO 10</option>
                <option>ROTAVÍRUS</option>
                <option>TRÍPLICE VIRAL</option>
                <option>POLIO (VIP)</option>
                <option>TETRA VIRAL</option>
                <option>COVID COMIRNATY ADULTO</option>
                <option>VSR BRONQUIOLITE</option>
                <option>INFLUENZA</option>
                <option>PNEUMO 23</option>

            </select>

            <!-- LOTE -->
            <input type="text" id="lote" placeholder="Digite o lote">

            <!-- VALIDADE -->
            <input type="date" id="validade">

            <!-- LABORATÓRIO -->
            <select id="laboratorio">

                <option selected>BUTANTAN</option>
                <option>FIOCRUZ</option>
                <option>PFIZER</option>
                <option>SERUM</option>
                <option>SINOVAC</option>
                <option>VARILRIX</option>
                <option>FUND</option>
                <option>TAKEDA</option>
                <option>ABRYSVO</option>
                <option>MSD</option>

            </select>

            <!-- OBSERVAÇÃO -->
            <input type="text" id="observacao" placeholder="Observação">

        </div>

        <button class="btn-add" onclick="adicionarVacina()">
            ADICIONAR VACINA
        </button>

    </div>

    <!-- TABELA -->

    <div class="table-container">

        <table id="tabela">

            <thead>

                <tr>
                    <th>VACINA</th>
                    <th>LOTE</th>
                    <th>VALIDADE</th>
                    <th>LABORATÓRIO</th>
                    <th>OBSERVAÇÃO</th>
                    <th>AÇÃO</th>
                </tr>

            </thead>

            <tbody></tbody>

        </table>

    </div>

</div>

<!-- FOOTER -->

<footer class="footer">

    <strong>ANTONIEL SOUSA</strong><br>
    UBS CIDADE SATÉLITE

</footer>

<!-- ÁREA DE IMPRESSÃO -->

<div class="print-area">

    <div class="print-box">

        <div class="print-header">

            <img src="https://www.natal.rn.gov.br/sme/matriculaonline/img/logo_natal_ws.png" alt="Logo Prefeitura">

            <h2>CONTROLE DE VACINAS</h2>

            <p>PREFEITURA MUNICIPAL DO NATAL</p>

        </div>

        <table class="print-table">

            <thead>

                <tr>
                    <th>VACINA</th>
                    <th>LOTE</th>
                    <th>VALIDADE</th>
                    <th>LABORATÓRIO</th>
                    <th>OBSERVAÇÃO</th>
                </tr>

            </thead>

            <tbody id="printTableBody"></tbody>

        </table>

        <div class="print-footer">

            UBS Cidade Satélite • Controle de Vacinas

        </div>

    </div>

</div>

<script>

function adicionarVacina(){

    const vacina = document.getElementById('vacina').value;
    const lote = document.getElementById('lote').value;
    const validade = document.getElementById('validade').value;
    const laboratorio = document.getElementById('laboratorio').value;
    const observacao = document.getElementById('observacao').value;

    if(lote === '' || validade === ''){

        alert('Preencha lote e validade');

        return;

    }

    const tabela = document.querySelector('#tabela tbody');

    const linha = tabela.insertRow();

    linha.innerHTML = `
        <td>${vacina}</td>
        <td>${lote}</td>
        <td>${formatarData(validade)}</td>
        <td>${laboratorio}</td>
        <td>${observacao}</td>
        <td>
            <button class="btn-delete" onclick="removerLinha(this)">
                Excluir
            </button>
        </td>
    `;

    atualizarImpressao();

    document.getElementById('lote').value = '';
    document.getElementById('validade').value = '';
    document.getElementById('observacao').value = '';

}

function removerLinha(botao){

    botao.parentElement.parentElement.remove();

    atualizarImpressao();

}

function atualizarImpressao(){

    const linhas = document.querySelectorAll('#tabela tbody tr');

    const printBody = document.getElementById('printTableBody');

    printBody.innerHTML = '';

    linhas.forEach(linha => {

        const colunas = linha.querySelectorAll('td');

        const novaLinha = `
            <tr>
                <td>${colunas[0].innerText}</td>
                <td>${colunas[1].innerText}</td>
                <td>${colunas[2].innerText}</td>
                <td>${colunas[3].innerText}</td>
                <td>${colunas[4].innerText}</td>
            </tr>
        `;

        printBody.innerHTML += novaLinha;

    });

}

function formatarData(data){

    const partes = data.split('-');

    return `${partes[2]}/${partes[1]}/${partes[0]}`;

}

</script>

</body>
</html>
