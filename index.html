<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CONTROLE DE VACINAS</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

<style>

/* =========================
   GERAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
    background:linear-gradient(90deg,#020617,#0f172a,#020617);
    min-height:100vh;
    color:#fff;
}

/* =========================
   CONTAINER
========================= */

.container{
    width:95%;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

/* =========================
   TOPO
========================= */

.topo{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:30px;
}

.logo{
    width:170px;
}

.btn-print{
    background:#fff;
    color:#000;
    border:none;
    padding:15px 30px;
    border-radius:14px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
}

.btn-print:hover{
    transform:scale(1.03);
}

/* =========================
   TITULO
========================= */

h1{
    font-size:50px;
    margin-bottom:30px;
    font-weight:700;
}

/* =========================
   FORM
========================= */

.form-box{
    background:#1d1d1d;
    padding:25px;
    border-radius:20px;
    margin-bottom:30px;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

.form-grid{
    display:grid;
    grid-template-columns: 2fr 1fr 1fr 1fr auto;
    gap:15px;
}

.form-control{
    width:100%;
    height:55px;
    border:none;
    border-radius:12px;
    background:#2a2a2a;
    color:#fff;
    padding:0 15px;
    font-size:15px;
}

.form-control:focus{
    outline:none;
    border:2px solid #2563eb;
}

.btn-add{
    border:none;
    height:55px;
    padding:0 30px;
    border-radius:12px;
    background:linear-gradient(90deg,#2563eb,#7c3aed);
    color:#fff;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
}

.btn-add:hover{
    transform:scale(1.03);
}

/* =========================
   TABELA
========================= */

.table-container{
    background:#1d1d1d;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#2563eb;
}

thead th{
    padding:15px;
    text-align:left;
    font-size:15px;
}

tbody td{
    padding:14px;
    border-top:1px solid #333;
}

tbody tr:nth-child(even){
    background:#262626;
}

.btn-delete{
    background:red;
    color:#fff;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
}

/* =========================
   IMPRESSÃO
========================= */

.print-header{
    display:none;
}

@media print{

    body{
        background:#fff !important;
    }

    .form-box,
    .btn-delete,
    .btn-print{
        display:none;
    }

    .container{
        width:18cm;
        margin:auto;
        padding:0;
    }

    .topo{
        display:none;
    }

    h1{
        display:none;
    }

    .print-header{
        display:block;
        text-align:center;
        margin-bottom:20px;
    }

    .print-header img{
        width:120px;
        margin-bottom:10px;
    }

    .print-header h2{
        color:#000;
        font-size:24px;
        margin-bottom:10px;
    }

    .table-container{
        background:#fff;
        box-shadow:none;
        border:none;
    }

    table{
        width:100%;
        font-size:12px;
    }

    thead{
        background:#d9d9d9 !important;
        color:#000 !important;
    }

    thead th{
        color:#000 !important;
        border:1px solid #000;
    }

    tbody td{
        color:#000 !important;
        border:1px solid #000;
    }

    tbody tr:nth-child(even),
    tbody tr:nth-child(odd){
        background:#fff !important;
    }

    @page{
        size:A4 portrait;
        margin:1cm;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- TOPO -->
    <div class="topo">

        <img
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/Logo_Prefeitura_de_Natal.svg/2560px-Logo_Prefeitura_de_Natal.svg.png"
        class="logo">

        <button class="btn-print" onclick="window.print()">
            IMPRIMIR
        </button>

    </div>

    <!-- TITULO -->
    <h1>CONTROLE DE VACINAS</h1>

    <!-- FORM -->
    <div class="form-box">

        <div class="form-grid">

            <select id="vacina" class="form-control">

                <option>ANTIRRÁBICA</option>
                <option>DT ADULTO</option>
                <option>DTPA GESTANTE</option>
                <option>DTP INFANTIL</option>
                <option>FEBRE AMARELA</option>
                <option>HPV4</option>
                <option>HEPATITE B</option>
                <option>HEPATITE PED A</option>
                <option>VARICELA</option>
                <option>MENINGO ACWY</option>
                <option>MENINGO C</option>
                <option>QDENGA</option>
                <option>DENGUE</option>
                <option>PENTA</option>
                <option>PNEUMO 10</option>
                <option>ROTAVÍRUS</option>
                <option>TRÍPLICE VIRAL</option>
                <option>POLIO (VIP)</option>
                <option>TETRA VIRAL</option>
                <option>INFLUENZA</option>
                <option>PNEUMO 23</option>

            </select>

            <input type="text"
            id="lote"
            class="form-control"
            placeholder="Digite o lote">

            <input type="date"
            id="validade"
            class="form-control">

            <select id="laboratorio" class="form-control">

                <option>BUTANTAN</option>
                <option>FIOCRUZ</option>
                <option>SERUM</option>
                <option>SINOVAC</option>
                <option>TAKEDA</option>
                <option>MSD</option>
                <option>ABRYSVO</option>

            </select>

            <button class="btn-add" onclick="adicionarVacina()">
                ADICIONAR
            </button>

        </div>

    </div>

    <!-- HEADER IMPRESSÃO -->
    <div class="print-header">

        <img
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/Logo_Prefeitura_de_Natal.svg/2560px-Logo_Prefeitura_de_Natal.svg.png">

        <h2>CONTROLE DE VACINAS</h2>

    </div>

    <!-- TABELA -->
    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>VACINAS</th>
                    <th>LOTES</th>
                    <th>VALIDADE</th>
                    <th>LABORATÓRIO</th>
                    <th>AÇÃO</th>
                </tr>

            </thead>

            <tbody id="tabelaVacinas">

                <tr>
                    <td>ANTIRRÁBICA</td>
                    <td>X1B951V</td>
                    <td>31/08/2026</td>
                    <td>BUTANTAN</td>
                    <td>
                        <button class="btn-delete">
                            Excluir
                        </button>
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

function adicionarVacina(){

    let vacina = document.getElementById("vacina").value;
    let lote = document.getElementById("lote").value;
    let validade = document.getElementById("validade").value;
    let laboratorio = document.getElementById("laboratorio").value;

    if(lote == "" || validade == ""){
        alert("Preencha todos os campos!");
        return;
    }

    let data = new Date(validade);

    let validadeFormatada =
        ("0" + data.getDate()).slice(-2) + "/" +
        ("0" + (data.getMonth()+1)).slice(-2) + "/" +
        data.getFullYear();

    let tabela = document.getElementById("tabelaVacinas");

    let linha = tabela.insertRow();

    linha.innerHTML = `
        <td>${vacina}</td>
        <td>${lote}</td>
        <td>${validadeFormatada}</td>
        <td>${laboratorio}</td>
        <td>
            <button class="btn-delete" onclick="excluirLinha(this)">
                Excluir
            </button>
        </td>
    `;

    document.getElementById("lote").value = "";
    document.getElementById("validade").value = "";

}

function excluirLinha(botao){

    botao.parentElement.parentElement.remove();

}

</script>

</body>
</html>
