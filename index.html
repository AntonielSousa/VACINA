<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle de Vacinas</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
    background: linear-gradient(90deg,#020817,#04122b,#020817);
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

.topo{
    width:100%;
    padding:30px 40px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo-central{
    width:100%;
    text-align:center;
}

.logo-central img{
    width:180px;
    margin-bottom:15px;
}

.logo-central h1{
    font-size:48px;
    font-weight:800;
    letter-spacing:1px;
}

/* ================= BOTÃO ================= */

.btn-print{
    position:fixed;
    top:20px;
    right:20px;
    background:#fff;
    color:#000;
    border:none;
    padding:15px 28px;
    border-radius:14px;
    font-weight:700;
    cursor:pointer;
    z-index:999;
    transition:0.3s;
}

.btn-print:hover{
    transform:scale(1.03);
}

/* ================= CARD ================= */

.container{
    width:95%;
    max-width:1700px;
    margin:auto;
    flex:1;
}

.card{
    background:#1f1f1f;
    border-radius:22px;
    padding:30px;
    margin-top:20px;
    box-shadow:0 0 30px rgba(0,0,0,0.3);
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
}

input,select{
    width:100%;
    height:58px;
    border-radius:14px;
    border:1px solid #444;
    background:#2a2a2a;
    color:#fff;
    padding:0 15px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#5d5dff;
}

.btn-add{
    margin-top:20px;
    width:100%;
    height:60px;
    border:none;
    border-radius:16px;
    background:linear-gradient(90deg,#0a00ff,#6a00ff);
    color:#fff;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.btn-add.editando {
    background:linear-gradient(90deg, #ff9900, #ff5500);
}

.btn-add:hover{
    transform:scale(1.01);
}

/* ================= TABELA ================= */

.table-container{
    margin-top:30px;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:15px;
}

thead{
    background:#315efb;
}

thead th{
    padding:14px;
    font-size:15px;
    text-align:center;
}

tbody tr{
    background:#242424;
}

tbody tr:nth-child(even){
    background:#2d2d2d;
}

tbody td{
    padding:14px;
    text-align:center;
}

.acoes-flex {
    display: flex;
    gap: 8px;
    justify-content: center;
}

.btn-edit{
    background:#ff9900;
    border:none;
    color:#fff;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}

.btn-delete{
    background:red;
    border:none;
    color:#fff;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}

/* ================= FOOTER ================= */

.footer{
    width:100%;
    margin-top:40px;
    padding:20px;
    text-align:center;
    background:#010b1d;
    border-top:1px solid rgba(255,255,255,0.1);
    font-size:14px;
    color:#cfcfcf;
}

.footer strong{
    color:#fff;
}

/* ================= IMPRESSÃO ================= */

.print-area{
    display:none;
}

@media print{

    @page{
        size: A4 portrait;
        margin: 8mm 8mm;
    }

    html, body {
        height: 100%;
        overflow: hidden;
        background: #fff;
        color: #000;
    }

    body {
        display: block !important;
    }

    .topo,
    .card,
    .btn-print,
    .table-container,
    .footer{
        display:none !important;
    }

    /* Container base da área de impressão */
    .print-area{
        display: flex;
        flex-direction: column;
        width: 100%;
        margin: 0;
        padding: 0;
        page-break-inside: avoid;
        break-inside: avoid;
        overflow: hidden;
    }

    /* Regra para OPÇÃO FOLHA INTEIRA */
    .print-area.folha-inteira {
        height: 100vh;
        max-height: 100vh;
    }

    /* Regra para OPÇÃO MEIA FOLHA */
    .print-area.meia-folha {
        height: 48vh;
        max-height: 48vh;
    }

    .print-box{
        width:100%;
        height:100%;
        border:2px solid #000;
        border-radius:10px;
        padding:8px;
        margin:0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .print-header{
        text-align:center;
        margin-bottom:10px;
    }

    .print-header img{
        width:80px;
        margin-bottom:4px;
    }

    .print-header h2{
        font-size:13px;
        color:#000;
        margin-bottom:2px;
        font-weight: 800;
    }

    .print-header p{
        color:#000;
        font-size:8px;
    }

    .print-table-wrapper {
        flex: 1;
        overflow: hidden;
        margin-top: 5px;
        margin-bottom: 10px;
    }

    .print-table{
        width:100%;
        border-collapse:collapse;
    }

    .print-table th{
        background:#ddd !important;
        color:#000 !important;
        border:1px solid #000;
        padding:2px;
        font-size:8px;
    }

    .print-table td{
        border:1px solid #000;
        padding:2px;
        font-size:7px;
        color:#000;
        text-align:center;
    }

    /* Ajustes específicos de tamanho reduzido quando for meia folha */
    .print-area.meia-folha .print-box { padding: 10px; }
    .print-area.meia-folha .print-header img { width: 95px; }
    .print-area.meia-folha .print-header h2 { font-size: 16px; }
    .print-area.meia-folha .print-table th, 
    .print-area.meia-folha .print-table td { padding: 4px 3px; font-size: 10px; }

    .print-footer{
        text-align:center;
        font-size:11px;
        color:#000;
        margin-top: auto;
        border-top: 1px dashed #000;
        padding-top: 5px;
    }

}

@media(max-width:900px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .logo-central h1{
        font-size:32px;
    }

}

</style>
</head>
<body>

<button class="btn-print" onclick="dispararImpressao()">
IMPRIMIR
</button>

<div class="topo">

    <div class="logo-central">

        <img src="https://www.natal.rn.gov.br/sme/matriculaonline/img/logo_natal_ws.png" alt="Logo Prefeitura">

        <h1>CONTROLE DE VACINAS</h1>

    </div>

</div>

<div class="container">

    <div class="card">

        <div class="form-grid">

            <select id="vacina">
                <option selected>ANTIRRÁBICA</option>
                <option>DT ADULTO</option>
                <option>DTpa GESTANTE</option>
                <option>DTp INFANTIL</option>
                <option>FEBRE AMARELA</option>
                <option>HPV4</option>
                <option>HEPATITE B</option>
                <option>HEPATITE PED A</option>
                <option>VARICELA</option>
                <option>MENINGO ACWY</option>
                <option>MENINGO C</option>
                <option>QDENGA</option>
                <option>DENGUE</option>
                <option>PENTA</option>
                <option>PNEUMO 10</option>
                <option>ROTAVÍRUS</option>
                <option>TRÍPLICE VIRAL</option>
                <option>POLIO (VIP)</option>
                <option>TETRA VIRAL</option>
                <option>COVID COMIRNATY ADULTO</option>
                <option>VSR BRONQUIOLITE</option>
                <option>INFLUENZA</option>
                <option>PNEUMO 23</option>
            </select>

            <input type="text" id="lote" placeholder="Digite o lote">

            <input type="date" id="validade">

            <select id="laboratorio">
                <option selected>BUTANTAN</option>
                <option>FIOCRUZ</option>
                <option>PFIZER</option>
                <option>SERUM</option>
                <option>SINOVAC</option>
                <option>VARILRIX</option>
                <option>FUND</option>
                <option>TAKEDA</option>
                <option>ABRYSVO</option>
                <option>MSD</option>
            </select>

            <input type="text" id="observacao" placeholder="Observação">

        </div>

        <input type="hidden" id="edit-id" value="">

        <button class="btn-add" id="btn-salvar" onclick="processarFormulario()">
            ADICIONAR VACINA
        </button>

    </div>

    <div class="table-container">

        <table id="tabela">
            <thead>
                <tr>
                    <th>VACINA</th>
                    <th>LOTE</th>
                    <th>VALIDADE</th>
                    <th>LABORATÓRIO</th>
                    <th>OBSERVAÇÃO</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

    </div>

</div>

<footer class="footer">
    <strong>ANTONIEL SOUSA</strong><br>
    UBS CIDADE SATÉLITE
</footer>

<div class="print-area" id="areaImpressao">
    <div class="print-box">
        <div>
            <div class="print-header">
                <img src="https://www.natal.rn.gov.br/sme/matriculaonline/img/logo_natal_ws.png" alt="Logo Prefeitura">
                <h2>CONTROLE DE VACINAS</h2>
                <p>PREFEITURA MUNICIPAL DO NATAL</p>
            </div>

            <div class="print-table-wrapper">
                <table class="print-table">
                    <thead>
                        <tr>
                            <th>VACINA</th>
                            <th>LOTE</th>
                            <th>VALIDADE</th>
                            <th>LABORATÓRIO</th>
                            <th>OBSERVAÇÃO</th>
                        </tr>
                    </thead>
                    <tbody id="printTableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="print-footer">
            UBS Cidade Satélite • Controle de Vacinas
        </div>
    </div>
</div>

<script>

document.addEventListener("DOMContentLoaded", () => {
    carregarVacinas();
});

// Nova função para gerenciar o tipo de folha escolhido
function dispararImpressao() {
    const escopoImpressao = document.getElementById('areaImpressao');
    
    // Pergunta ao usuário qual o formato desejado
    const desejaMeiaFolha = confirm("Deseja imprimir em MEIA FOLHA?\n\n[OK] para Meia Folha\n[Cancelar] para Folha Inteira");

    if (desejaMeiaFolha) {
        escopoImpressao.classList.remove('folha-inteira');
        escopoImpressao.classList.add('meia-folha');
    } else {
        escopoImpressao.classList.remove('meia-folha');
        escopoImpressao.classList.add('folha-inteira');
    }

    // Abre a janela de impressão do navegador
    window.print();
}

function processarFormulario() {
    const idEdicao = document.getElementById('edit-id').value;

    if (idEdicao === "") {
        adicionarVacina();
    } else {
        salvarEdicao(parseInt(idEdicao));
    }
}

function adicionarVacina(){
    const vacina = document.getElementById('vacina').value;
    const lote = document.getElementById('lote').value;
    const validade = document.getElementById('validade').value;
    const laboratorio = document.getElementById('laboratorio').value;
    const observacao = document.getElementById('observacao').value;

    if(lote === '' || validade === ''){
        alert('Preencha lote e validade');
        return;
    }

    const novaVacina = {
        id: Date.now(),
        vacina,
        lote,
        validade,
        laboratorio,
        observacao
    };

    salvarNoLocalStorage(novaVacina);
    adicionarLinhaNaTabela(novaVacina);
    atualizarImpressao();
    limparFormulario();
}

function adicionarLinhaNaTabela(item) {
    const tabela = document.querySelector('#tabela tbody');
    const linha = tabela.insertRow();
    
    linha.setAttribute('data-id', item.id);

    linha.innerHTML = `
        <td>${item.vacina}</td>
        <td>${item.lote}</td>
        <td>${formatarData(item.validade)}</td>
        <td>${item.laboratorio}</td>
        <td>${item.observacao}</td>
        <td>
            <div class="acoes-flex">
                <button class="btn-edit" onclick="prepararEdicao(${item.id})">Editar</button>
                <button class="btn-delete" onclick="removerLinha(this, ${item.id})">Excluir</button>
            </div>
        </td>
    `;
}

function prepararEdicao(id) {
    const vacinas = obterVacinasSalvas();
    const item = vacinas.find(v => v.id === id);

    if (item) {
        document.getElementById('vacina').value = item.vacina;
        document.getElementById('lote').value = item.lote;
        document.getElementById('validade').value = item.validade;
        document.getElementById('laboratorio').value = item.laboratorio;
        document.getElementById('observacao').value = item.observacao;
        
        document.getElementById('edit-id').value = item.id;

        const btnSalvar = document.getElementById('btn-salvar');
        btnSalvar.innerText = "SALVAR ALTERAÇÕES";
        btnSalvar.classList.add('editando');
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

function salvarEdicao(id) {
    const vacina = document.getElementById('vacina').value;
    const lote = document.getElementById('lote').value;
    const validade = document.getElementById('validade').value;
    const laboratorio = document.getElementById('laboratorio').value;
    const observacao = document.getElementById('observacao').value;

    if(lote === '' || validade === ''){
        alert('Preencha lote e validade');
        return;
    }

    let vacinas = obterVacinasSalvas();
    const index = vacinas.findIndex(v => v.id === id);

    if (index !== -1) {
        vacinas[index] = { id, vacina, lote, validade, laboratorio, observacao };
        localStorage.setItem('controle_vacinas', JSON.stringify(vacinas));

        const linha = document.querySelector(`tr[data-id="${id}"]`);
        if (linha) {
            linha.innerHTML = `
                <td>${vacina}</td>
                <td>${lote}</td>
                <td>${formatarData(validade)}</td>
                <td>${laboratorio}</td>
                <td>${observacao}</td>
                <td>
                    <div class="acoes-flex">
                        <button class="btn-edit" onclick="prepararEdicao(${id})">Editar</button>
                        <button class="btn-delete" onclick="removerLinha(this, ${id})">Excluir</button>
                    </div>
                </td>
            `;
        }

        atualizarImpressao();
        limparFormulario();
    }
}

function removerLinha(botao, id){
    const idEdicao = document.getElementById('edit-id').value;
    if (idEdicao == id) {
        limparFormulario();
    }

    botao.parentElement.parentElement.parentElement.remove();
    removerDoLocalStorage(id);
    atualizarImpressao();
}

function limparFormulario() {
    document.getElementById('lote').value = '';
    document.getElementById('validade').value = '';
    document.getElementById('observacao').value = '';
    document.getElementById('edit-id').value = '';

    const btnSalvar = document.getElementById('btn-salvar');
    btnSalvar.innerText = "ADICIONAR VACINA";
    btnSalvar.classList.remove('editando');
}

function salvarNoLocalStorage(vacina) {
    let vacinas = obterVacinasSalvas();
    vacinas.push(vacina);
    localStorage.setItem('controle_vacinas', JSON.stringify(vacinas));
}

function obterVacinasSalvas() {
    const dados = localStorage.getItem('controle_vacinas');
    return dados ? JSON.parse(dados) : [];
}

function removerDoLocalStorage(id) {
    let vacinas = obterVacinasSalvas();
    vacinas = vacinas.filter(item => item.id !== id);
    localStorage.setItem('controle_vacinas', JSON.stringify(vacinas));
}

function carregarVacinas() {
    const vacinas = obterVacinasSalvas();
    vacinas.forEach(item => {
        adicionarLinhaNaTabela(item);
    });
    atualizarImpressao();
}

function atualizarImpressao(){
    const linhas = document.querySelectorAll('#tabela tbody tr');
    const printBody = document.getElementById('printTableBody');
    printBody.innerHTML = '';

    linhas.forEach(linha => {
        const colunas = inlineColunas(linha);
        const novaLinha = `
            <tr>
                <td>${colunas[0]}</td>
                <td>${colunas[1]}</td>
                <td>${colunas[2]}</td>
                <td>${colunas[3]}</td>
                <td>${colunas[4]}</td>
            </tr>
        `;
        printBody.innerHTML += novaLinha;
    });
}

function inlineColunas(linha) {
    const tds = inlineTds(linha);
    return tds.map(td => td.innerText);
}

function inlineTds(linha) {
    return Array.from(linha.querySelectorAll('td'));
}

function formatarData(data){
    if(!data.includes('-')) return data; 
    const partes = data.split('-');
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
}

</script>

</body>
</html>
